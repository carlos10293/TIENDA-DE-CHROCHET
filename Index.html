<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frida Sofia | Atelier & Pagos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@100;300;600&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
        @layer base {
            body { @apply bg-white text-[#1a1a1a] antialiased overflow-x-hidden; font-family: 'Montserrat', sans-serif; }
            .font-serif { font-family: 'Cormorant Garamond', serif; }
        }
        .btn-black {
            @apply bg-black text-white px-8 py-4 text-[10px] tracking-[0.3em] uppercase font-black 
                   transition-all duration-300 hover:bg-zinc-800 disabled:opacity-20 flex items-center justify-center gap-2;
        }
        .btn-outline {
            @apply border border-zinc-200 text-black px-8 py-4 text-[10px] tracking-[0.3em] uppercase font-black 
                   transition-all duration-300 hover:bg-zinc-50 flex items-center justify-center gap-2;
        }
        .input-line {
            @apply border-b border-zinc-200 py-3 w-full text-sm outline-none focus:border-black transition-all bg-transparent rounded-none;
        }
        .loader {
            border-top-color: #000;
            animation: spinner 0.6s linear infinite;
        }
        @keyframes spinner { to { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'frida-boutique-v2';

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const CATEGORIES = ["Todos", "Vestidos", "Tops", "Accesorios", "Exclusivos"];
        const ADMIN_PIN = "2024";
        
        // Enlace de Stripe verificado
        const STRIPE_LINK = "https://buy.stripe.com/00weVcchf6UKfGfdMx18c04";
        
        // Número de WhatsApp con formato internacional corregido para México (+52 1 + 10 dígitos)
        const WHATSAPP_NUM = "5215648515663"; 

        function App() {
            const [user, setUser] = useState(null);
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState([]);
            const [view, setView] = useState('home'); 
            const [isAdmin, setIsAdmin] = useState(false);
            const [loading, setLoading] = useState(true);
            const [isProcessing, setIsProcessing] = useState(false);
            const [statusMsg, setStatusMsg] = useState(null);
            
            const [loginPin, setLoginPin] = useState('');
            const [activeCategory, setActiveCategory] = useState('Todos');
            const [showModal, setShowModal] = useState(false);
            const [formData, setFormData] = useState({ name: '', price: '', category: 'Vestidos', image: '', stock: 1, description: '' });

            useEffect(() => {
                const init = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (e) { console.error(e); }
                };
                init();
                const unsub = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (sessionStorage.getItem('fridaAdmin') === 'true') setIsAdmin(true);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products')
                    .onSnapshot((snap) => {
                        const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setProducts(data);
                        setLoading(false);
                    }, (err) => console.error(err));
                return () => unsub();
            }, [user]);

            const addToCart = (product) => {
                setCart(prev => [...prev, product]);
                setStatusMsg("Añadido a la bolsa");
                setTimeout(() => setStatusMsg(null), 1500);
            };

            const removeFromCart = (index) => {
                setCart(prev => prev.filter((_, i) => i !== index));
            };

            // Función de Pago Stripe - Redirección directa para máxima compatibilidad
            const handleCheckoutStripe = () => {
                if (cart.length === 0) return;
                // Usamos location.href para asegurar que no se bloquee como pop-up
                window.location.href = STRIPE_LINK;
            };

            // Función de WhatsApp - Formato wa.me simplificado
            const handleCheckoutWA = () => {
                if (cart.length === 0) return;
                const total = cart.reduce((a,b) => a + b.price, 0);
                const itemsList = cart.map(i => `- ${i.name}`).join(', ');
                
                const message = `Hola Frida Sofia! Quiero comprar: ${itemsList}. Total: $${total.toLocaleString()}. ¿Me das info para el pago?`;
                
                // Formato de enlace de WhatsApp más compatible
                const waUrl = `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(message)}`;
                window.location.href = waUrl;
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginPin === ADMIN_PIN) {
                    setIsAdmin(true);
                    sessionStorage.setItem('fridaAdmin', 'true');
                    setView('admin');
                } else {
                    alert("PIN Incorrecto");
                }
                setLoginPin('');
            };

            const optimizeImage = (base64) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = base64;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        const scale = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5));
                    };
                });
            };

            const saveProduct = async (e) => {
                e.preventDefault();
                if (!user || isProcessing) return;
                setIsProcessing(true);
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').add({
                        ...formData,
                        price: Number(formData.price),
                        stock: Number(formData.stock),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setShowModal(false);
                    setFormData({ name: '', price: '', category: 'Vestidos', image: '', stock: 1, description: '' });
                } catch (err) { alert("Error al subir el producto"); }
                finally { setIsProcessing(false); }
            };

            if (loading) return (
                <div className="h-screen flex items-center justify-center bg-white">
                    <div className="w-8 h-8 loader border-2 border-zinc-100 rounded-full"></div>
                </div>
            );

            return (
                <div className="min-h-screen">
                    <nav className="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-zinc-50 px-6 h-20 flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <button onClick={() => isAdmin ? setView('admin') : setView('login')} className="opacity-10 hover:opacity-100 transition-opacity">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </button>
                            <h1 onClick={() => setView('home')} className="font-serif text-2xl italic cursor-pointer tracking-tighter">Frida Sofia</h1>
                        </div>
                        <div className="flex gap-8 items-center">
                            <button onClick={() => setView('shop')} className="text-[9px] uppercase font-black tracking-widest hidden md:block">Colección</button>
                            <button onClick={() => setView('cart')} className="relative p-2">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                                {cart.length > 0 && <span className="absolute top-0 right-0 bg-black text-white text-[7px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{cart.length}</span>}
                            </button>
                        </div>
                    </nav>

                    <main className="pt-20">
                        {view === 'home' && (
                            <section className="relative h-[90vh] flex flex-col items-center justify-center text-center px-6 bg-zinc-950 text-white">
                                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1000&auto=format&fit=crop" className="absolute inset-0 w-full h-full object-cover opacity-40" />
                                <div className="relative z-10 space-y-6">
                                    <span className="text-[10px] uppercase tracking-[0.5em] opacity-60">Atelier de Alta Costura</span>
                                    <h2 className="text-6xl md:text-9xl font-serif italic tracking-tighter leading-none">Nueva<br/>Estación</h2>
                                    <button onClick={() => setView('shop')} className="bg-white text-black px-12 py-5 text-[10px] uppercase font-black tracking-[0.4em] hover:bg-zinc-200 transition-colors">Explorar Catálogo</button>
                                </div>
                            </section>
                        )}

                        {view === 'shop' && (
                            <div className="max-w-7xl mx-auto px-6 py-16">
                                <div className="flex gap-4 overflow-x-auto pb-12 no-scrollbar">
                                    {CATEGORIES.map(c => (
                                        <button key={c} onClick={() => setActiveCategory(c)} className={`text-[9px] uppercase font-black tracking-widest px-6 py-2 border transition-all ${activeCategory === c ? 'bg-black text-white border-black' : 'border-zinc-100 text-zinc-400 hover:border-zinc-300'}`}>
                                            {c}
                                        </button>
                                    ))}
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-12">
                                    {products.filter(p => activeCategory === 'Todos' || p.category === activeCategory).map(p => (
                                        <div key={p.id} className="group cursor-pointer">
                                            <div className="aspect-[3/4] bg-zinc-50 mb-5 overflow-hidden relative" onClick={() => addToCart(p)}>
                                                <img src={p.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                                <div className="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-4">
                                                    <button className="w-full bg-white text-black py-3 text-[9px] font-black uppercase tracking-widest shadow-xl">Añadir</button>
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-baseline">
                                                <h4 className="font-serif text-xl italic tracking-tight">{p.name}</h4>
                                                <span className="text-[11px] font-light text-zinc-400">${p.price.toLocaleString()}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'cart' && (
                            <div className="max-w-2xl mx-auto px-6 py-20">
                                <h2 className="text-5xl font-serif italic mb-12 tracking-tighter text-center">Tu Bolsa</h2>
                                {cart.length === 0 ? (
                                    <div className="py-20 text-center border-y border-zinc-50">
                                        <p className="italic font-serif text-xl text-zinc-300">Tu bolsa está vacía.</p>
                                        <button onClick={() => setView('shop')} className="mt-8 text-[10px] uppercase font-black border-b border-black pb-1">Ir a comprar</button>
                                    </div>
                                ) : (
                                    <div className="space-y-8">
                                        {cart.map((item, i) => (
                                            <div key={i} className="flex gap-6 items-center border-b border-zinc-50 pb-8">
                                                <img src={item.image} className="w-20 h-24 object-cover" />
                                                <div className="flex-grow">
                                                    <div className="flex justify-between">
                                                        <h4 className="font-serif text-xl italic">{item.name}</h4>
                                                        <button onClick={() => removeFromCart(i)} className="text-zinc-300 hover:text-black">Quitar</button>
                                                    </div>
                                                    <p className="text-lg font-serif italic mt-2">${item.price.toLocaleString()}</p>
                                                </div>
                                            </div>
                                        ))}
                                        
                                        <div className="pt-10 space-y-10">
                                            <div className="flex justify-between items-end border-t border-black pt-6">
                                                <span className="text-[10px] uppercase font-black tracking-widest">Total</span>
                                                <span className="text-5xl font-serif italic tracking-tighter">${cart.reduce((a,b) => a+b.price, 0).toLocaleString()}</span>
                                            </div>

                                            <div className="grid grid-cols-1 gap-4">
                                                <button onClick={handleCheckoutStripe} className="btn-black w-full py-6">
                                                    Pagar con Tarjeta (Stripe)
                                                </button>
                                                
                                                <button onClick={handleCheckoutWA} className="btn-outline w-full py-6 text-green-700 border-green-200">
                                                    Finalizar por WhatsApp
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'login' && (
                            <div className="max-w-xs mx-auto py-32 text-center">
                                <form onSubmit={handleLogin} className="space-y-8">
                                    <h3 className="font-serif text-3xl italic tracking-tighter">Administración</h3>
                                    <input 
                                        type="password" 
                                        className="input-line text-center text-3xl tracking-[0.4em] font-serif" 
                                        value={loginPin} 
                                        onChange={e => setLoginPin(e.target.value)}
                                        placeholder="0000"
                                        autoFocus
                                    />
                                    <button className="btn-black w-full py-5">Entrar</button>
                                </form>
                            </div>
                        )}

                        {view === 'admin' && isAdmin && (
                            <div className="max-w-6xl mx-auto px-6 py-16">
                                <div className="flex justify-between items-end mb-16 border-b border-zinc-100 pb-10">
                                    <h2 className="text-4xl font-serif italic tracking-tighter">Inventario</h2>
                                    <div className="flex gap-4">
                                        <button onClick={() => {setIsAdmin(false); setView('home');}} className="btn-outline px-4 py-2 text-[8px]">Salir</button>
                                        <button onClick={() => setShowModal(true)} className="btn-black">Nuevo Producto</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {products.map(p => (
                                        <div key={p.id} className="bg-white p-5 border border-zinc-100 flex gap-5">
                                            <img src={p.image} className="w-20 h-28 object-cover bg-zinc-50" />
                                            <div className="flex-grow flex flex-col justify-between">
                                                <div>
                                                    <p className="font-serif text-xl italic">{p.name}</p>
                                                    <p className="text-[9px] font-black text-zinc-300 uppercase mt-1">${p.price}</p>
                                                </div>
                                                <button onClick={() => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').doc(p.id).delete()} className="text-[8px] uppercase font-black text-red-300 hover:text-red-600">Eliminar</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {showModal && (
                        <div className="fixed inset-0 z-[100] bg-white flex flex-col p-6 overflow-y-auto">
                            <div className="max-w-xl mx-auto w-full py-10">
                                <div className="flex justify-between items-center mb-16">
                                    <h2 className="font-serif text-4xl italic tracking-tighter">Nueva Pieza</h2>
                                    <button onClick={() => setShowModal(false)} className="text-4xl font-light">&times;</button>
                                </div>
                                <form onSubmit={saveProduct} className="space-y-10">
                                    <div 
                                        className="aspect-[4/5] bg-zinc-50 border border-dashed border-zinc-200 flex flex-col items-center justify-center cursor-pointer overflow-hidden group"
                                        onClick={() => document.getElementById('fileIn').click()}
                                    >
                                        {formData.image ? (
                                            <img src={formData.image} className="w-full h-full object-cover" />
                                        ) : (
                                            <p className="text-[8px] uppercase font-black tracking-[0.3em] opacity-30 text-center">Subir Foto</p>
                                        )}
                                    </div>
                                    <input id="fileIn" type="file" className="hidden" accept="image/*" onChange={async e => {
                                        const file = e.target.files[0];
                                        if(file) {
                                            setIsProcessing(true);
                                            const reader = new FileReader();
                                            reader.onload = async (ev) => {
                                                const opt = await optimizeImage(ev.target.result);
                                                setFormData({...formData, image: opt});
                                                setIsProcessing(false);
                                            };
                                            reader.readAsDataURL(file);
                                        }
                                    }} />
                                    
                                    <div className="space-y-6">
                                        <input placeholder="Nombre" className="input-line text-2xl font-serif italic" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />
                                        <input type="number" placeholder="Precio" className="input-line font-bold" value={formData.price} onChange={e => setFormData({...formData, price: e.target.value})} required />
                                        <select className="input-line text-[10px] uppercase font-black" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>
                                            {CATEGORIES.slice(1).map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>

                                    <button disabled={isProcessing || !formData.image} className="btn-black w-full py-6">
                                        {isProcessing ? 'Guardando...' : 'Guardar'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {statusMsg && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-black text-white px-8 py-4 text-[9px] font-black uppercase tracking-[0.3em] z-[200] shadow-2xl">
                            {statusMsg}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
