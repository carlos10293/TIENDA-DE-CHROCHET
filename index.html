<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frida | Heritage Art Gallery</title>
    
    <!-- Frameworks & Engine -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (Version Robusta) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #ffffff; --bg: #050505; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: white; margin: 0; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Estética de Galería Minimalista */
        .glass-nav { background: rgba(5, 5, 5, 0.8); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(255,255,255,0.03); }
        .product-image-container { position: relative; overflow: hidden; background: #0a0a0a; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .product-image-container img { transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); filter: grayscale(20%); }
        .product-card:hover img { transform: scale(1.05); filter: grayscale(0%); }
        
        /* Animaciones de carga */
        .page-loader { position: fixed; inset: 0; background: #050505; z-index: 1000; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .dot-loader { width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.1); border-top-color: white; border-radius: 50%; animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Estilos de Admin */
        .admin-sidebar { border-left: 1px solid rgba(255,255,255,0.05); }
        .btn-primary { background: white; color: black; font-weight: 600; transition: all 0.3s ease; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline { border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBOE6fMDtoCsJ92oVdY_ZqBuNDW-idyUqc",
            authDomain: "frida-s-6a626.firebaseapp.com",
            projectId: "frida-s-6a626",
            storageBucket: "frida-s-6a626.firebasestorage.app",
            messagingSenderId: "951753942306",
            appId: "1:951753942306:web:18c6f4358164b840e1f17b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        
        const APP_ID = "frida-s-6a626";
        const STRIPE_LINK = "https://buy.stripe.com/fZu4gy5SR0wmfGfcIt18c07";

        // CONFIGURACIÓN DE SEGURIDAD REAL
        // Solo estos correos verán las herramientas de edición.
        const AUTHORIZED_ADMINS = ["tu-correo@gmail.com", "admin@frida.com"]; 

        function App() {
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('gallery');
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState([]);
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminPanel, setShowAdminPanel] = useState(false);
            
            // Estado para nuevo producto
            const [form, setForm] = useState({ name: '', price: '', image: '' });
            const [isSaving, setIsSaving] = useState(false);

            useEffect(() => {
                // Suscripción de Autenticación
                const unsubAuth = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setIsAdmin(u && AUTHORIZED_ADMINS.includes(u.email));
                    setLoading(false);
                });

                // Suscripción de Datos (Tiempo Real)
                const unsubData = db.collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection('products')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snap => {
                        setProducts(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                return () => { unsubAuth(); unsubData(); };
            }, []);

            const handleLogin = async () => {
                try {
                    await auth.signInWithPopup(provider);
                } catch (e) { console.error("Auth error", e); }
            };

            const handleLogout = () => auth.signOut();

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 1500000) return alert("Imagen demasiado grande (máximo 1.5MB)");
                
                const reader = new FileReader();
                reader.onloadend = () => setForm({ ...form, image: reader.result });
                reader.readAsDataURL(file);
            };

            const saveProduct = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;
                setIsSaving(true);
                try {
                    await db.collection('artifacts').doc(APP_ID)
                        .collection('public').doc('data')
                        .collection('products').add({
                            ...form,
                            price: Number(form.price),
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    setForm({ name: '', price: '', image: '' });
                    setShowAdminPanel(false);
                } catch (e) { alert("Error al guardar en el servidor"); }
                finally { setIsSaving(false); }
            };

            const deleteProduct = async (id) => {
                if (!isAdmin) return;
                if (confirm("¿Retirar esta pieza de la galería permanentemente?")) {
                    await db.collection('artifacts').doc(APP_ID)
                        .collection('public').doc('data')
                        .collection('products').doc(id).delete();
                }
            };

            if (loading) return <div className="page-loader"><div className="dot-loader"></div></div>;

            return (
                <div className="min-h-screen selection:bg-white selection:text-black">
                    {/* Navegación Refinada */}
                    <nav className="fixed top-0 w-full z-50 glass-nav py-6 px-8 md:px-20 flex justify-between items-center">
                        <div onClick={() => setView('gallery')} className="cursor-pointer group">
                            <h1 className="font-serif text-3xl tracking-tighter italic">Frida</h1>
                            <div className="h-[1px] w-0 group-hover:w-full bg-white transition-all duration-500"></div>
                        </div>

                        <div className="flex items-center gap-10">
                            <button onClick={() => setView('gallery')} className="text-[10px] uppercase tracking-[0.3em] font-medium opacity-60 hover:opacity-100 transition-opacity">Colección</button>
                            
                            <button onClick={() => setView('cart')} className="relative text-[10px] uppercase tracking-[0.3em] font-medium opacity-60 hover:opacity-100 transition-opacity">
                                Bolsa {cart.length > 0 && <span className="ml-1 text-white font-bold">({cart.length})</span>}
                            </button>

                            {isAdmin && (
                                <button onClick={() => setShowAdminPanel(true)} className="text-[10px] uppercase tracking-[0.3em] font-black text-white bg-white/10 px-4 py-2 rounded-sm hover:bg-white/20 transition-all">
                                    Management
                                </button>
                            )}

                            {!user ? (
                                <button onClick={handleLogin} className="text-[10px] uppercase tracking-[0.3em] font-black border border-white/20 px-4 py-2 rounded-sm hover:bg-white hover:text-black transition-all">Acceso</button>
                            ) : (
                                <div className="flex items-center gap-4 group cursor-pointer relative">
                                    <img src={user.photoURL} className="w-6 h-6 rounded-full grayscale hover:grayscale-0 transition-all" />
                                    <div className="absolute right-0 top-full mt-4 hidden group-hover:block glass-nav p-4 border border-white/10">
                                        <p className="text-[9px] uppercase tracking-widest whitespace-nowrap mb-2 opacity-50">{user.email}</p>
                                        <button onClick={handleLogout} className="text-[10px] text-red-400 uppercase font-black tracking-widest">Logout</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </nav>

                    {/* Contenido Principal */}
                    <main className="pt-44 px-8 md:px-20 max-w-[1600px] mx-auto pb-40">
                        {view === 'gallery' && (
                            <section>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-24">
                                    {products.map(p => (
                                        <div key={p.id} className="product-card">
                                            <div className="product-image-container aspect-[4/5] mb-8">
                                                <img src={p.image} className="w-full h-full object-cover" />
                                                <div className="absolute inset-0 bg-black/40 opacity-0 hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-8">
                                                    <button 
                                                        onClick={() => setCart([...cart, p])}
                                                        className="w-full bg-white text-black py-4 text-[11px] font-black uppercase tracking-[0.3em]"
                                                    >
                                                        Adquirir Pieza
                                                    </button>
                                                </div>
                                                {isAdmin && (
                                                    <button onClick={() => deleteProduct(p.id)} className="absolute top-6 right-6 bg-black/80 p-3 hover:bg-red-900 transition-colors">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 6L5 19M5 6l14 14"/></svg>
                                                    </button>
                                                )}
                                            </div>
                                            <div className="flex justify-between items-baseline border-b border-white/5 pb-4">
                                                <div>
                                                    <h3 className="font-serif text-2xl italic tracking-tight">{p.name}</h3>
                                                    <p className="text-[10px] uppercase tracking-[0.4em] opacity-40 mt-1">Oaxaca Heritage</p>
                                                </div>
                                                <p className="text-xl font-light opacity-80">${p.price.toLocaleString()}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}

                        {view === 'cart' && (
                            <section className="max-w-3xl mx-auto animate-in fade-in duration-700">
                                <h2 className="font-serif text-6xl italic mb-20 text-center">Bolsa de Selección</h2>
                                {cart.length === 0 ? (
                                    <div className="text-center py-20 opacity-40">
                                        <p className="text-[10px] uppercase tracking-[0.5em]">La colección está vacía</p>
                                    </div>
                                ) : (
                                    <div className="space-y-12">
                                        {cart.map((item, i) => (
                                            <div key={i} className="flex gap-8 items-center border-b border-white/5 pb-10">
                                                <img src={item.image} className="w-24 h-32 object-cover grayscale" />
                                                <div className="flex-1">
                                                    <h4 className="font-serif text-3xl italic">{item.name}</h4>
                                                    <p className="text-xs opacity-50 mt-1">Envío Asegurado Incluido</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-2xl font-light mb-4">${item.price.toLocaleString()}</p>
                                                    <button onClick={() => {
                                                        const n = [...cart]; n.splice(i,1); setCart(n);
                                                    }} className="text-[9px] uppercase tracking-widest font-black text-red-500 opacity-60 hover:opacity-100">Remover</button>
                                                </div>
                                            </div>
                                        ))}
                                        <div className="pt-10 flex justify-between items-end">
                                            <span className="text-[10px] uppercase tracking-[0.5em] opacity-50">Total de Inversión</span>
                                            <span className="text-6xl font-serif italic">${cart.reduce((s,i) => s+i.price, 0).toLocaleString()}</span>
                                        </div>
                                        <a href={STRIPE_LINK} target="_blank" className="block w-full bg-white text-black text-center py-6 text-[12px] font-black uppercase tracking-[0.4em] hover:scale-[1.01] transition-all shadow-2xl">
                                            Proceder al Pago Seguro
                                        </a>
                                    </div>
                                )}
                            </section>
                        )}
                    </main>

                    {/* Panel de Gestión (Solo Admin) */}
                    {isAdmin && showAdminPanel && (
                        <div className="fixed inset-0 z-[200] flex justify-end">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setShowAdminPanel(false)}></div>
                            <div className="relative w-full max-w-lg bg-[#0a0a0a] h-full p-12 admin-sidebar flex flex-col animate-in slide-in-from-right duration-500">
                                <div className="flex justify-between items-center mb-16">
                                    <h3 className="font-serif text-4xl italic">Inventario</h3>
                                    <button onClick={() => setShowAdminPanel(false)} className="text-[10px] uppercase font-black opacity-40 hover:opacity-100">Cerrar</button>
                                </div>

                                <form onSubmit={saveProduct} className="space-y-10">
                                    <div className="relative aspect-video bg-black/50 border border-white/5 rounded-sm flex items-center justify-center overflow-hidden group">
                                        {form.image ? (
                                            <img src={form.image} className="w-full h-full object-cover" />
                                        ) : (
                                            <div className="text-center">
                                                <p className="text-[10px] uppercase tracking-widest opacity-30">Cargar Fotografía</p>
                                                <p className="text-[8px] mt-2 opacity-20">JPG/PNG MAX 1.5MB</p>
                                            </div>
                                        )}
                                        <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" onChange={handleFileUpload} />
                                    </div>

                                    <div className="space-y-1">
                                        <label className="text-[9px] uppercase tracking-widest opacity-40">Título de la Pieza</label>
                                        <input required className="w-full bg-transparent border-b border-white/10 py-3 outline-none focus:border-white transition-all text-xl font-serif italic" 
                                            value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                                    </div>

                                    <div className="space-y-1">
                                        <label className="text-[9px] uppercase tracking-widest opacity-40">Valor (MXN)</label>
                                        <input required type="number" className="w-full bg-transparent border-b border-white/10 py-3 outline-none focus:border-white transition-all text-2xl font-light" 
                                            value={form.price} onChange={e => setForm({...form, price: e.target.value})} />
                                    </div>

                                    <button 
                                        disabled={isSaving}
                                        className={`w-full py-5 text-[10px] font-black uppercase tracking-[0.4em] transition-all ${isSaving ? 'bg-neutral-800 opacity-50' : 'btn-primary'}`}
                                    >
                                        {isSaving ? 'Guardando Obra...' : 'Publicar en Galería'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-white/5 py-20 px-8 text-center opacity-30">
                        <p className="text-[9px] uppercase tracking-[1em]">Frida Heritage Art • Oaxaca • 2024</p>
                      </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBOE6fMDtoCsJ92oVdY_ZqBuNDW-idyUqc",
            authDomain: "frida-s-6a626.firebaseapp.com",
            projectId: "frida-s-6a626",
            storageBucket: "frida-s-6a626.firebasestorage.app",
            messagingSenderId: "951753942306",
            appId: "1:951753942306:web:18c6f4358164b840e1f17b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        const APP_ID = "frida-s-6a626";

        function App() {
            const [view, setView] = useState('shop');
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState([]);
            const [loading, setLoading] = useState(true);
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [newProduct, setNewProduct] = useState({ name: '', price: '', description: '', image: '' });

            useEffect(() => {
                // Escuchar cambios de autenticación
                const unsubAuth = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    // Aquí puedes definir tu correo para que seas admin siempre al loguearte
                    if (currentUser && (currentUser.email === "tu-correo@gmail.com" || currentUser.isAnonymous === false)) {
                        setIsAdmin(true);
                    }
                });

                // Cargar productos
                const unsubData = db.collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection('products')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snapshot => {
                        setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                        setLoading(false);
                    }, err => {
                        console.error("Error Firestore:", err);
                        setLoading(false);
                    });

                return () => { unsubAuth(); unsubData(); };
            }, []);

            const loginGoogle = async () => {
                try {
                    await auth.signInWithPopup(provider);
                } catch (err) {
                    alert("Error al iniciar sesión: " + err.message);
                }
            };

            const logout = () => auth.signOut().then(() => {
                setUser(null);
                setIsAdmin(false);
                setView('shop');
            });

            const handleUpload = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('artifacts').doc(APP_ID)
                            .collection('public').doc('data')
                            .collection('products').add({
                                ...newProduct,
                                price: Number(newProduct.price),
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                    setIsModalOpen(false);
                    setNewProduct({ name: '', price: '', description: '', image: '' });
                } catch (err) {
                    alert("Error: " + err.message);
                }
            };

            const deleteProduct = async (id) => {
                if (confirm("¿Estás seguro de eliminar esta pieza de la galería?")) {
                    try {
                        await db.collection('artifacts').doc(APP_ID)
                                .collection('public').doc('data')
                                .collection('products').doc(id).delete();
                    } catch (err) {
                        alert("Error al eliminar: " + err.message);
                    }
                }
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
            };

            if (loading) return <div className="h-screen flex items-center justify-center bg-black"><div className="loader"></div></div>;

            return (
                <div className="min-h-screen">
                    <nav className="fixed top-0 w-full z-50 glass border-b border-white/5 p-4 flex justify-between items-center px-6 md:px-12">
                        <div onClick={() => setView('shop')} className="cursor-pointer">
                            <h1 className="font-serif text-2xl italic">Frida</h1>
                        </div>
                        
                        <div className="flex items-center gap-6">
                            {/* Botón de Google o Info de Usuario */}
                            {!user ? (
                                <button onClick={loginGoogle} className="btn-google text-[10px] px-4 py-2 rounded-full font-bold uppercase tracking-tighter flex items-center gap-2">
                                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="14" />
                                    Entrar
                                </button>
                            ) : (
                                <div className="flex items-center gap-3">
                                    <img src={user.photoURL || 'https://via.placeholder.com/30'} className="w-7 h-7 rounded-full border border-white/20" />
                                    <button onClick={logout} className="text-[10px] text-neutral-500 hover:text-white uppercase font-bold">Salir</button>
                                </div>
                            )}

                            {isAdmin && (
                                <button onClick={() => setIsModalOpen(true)} className="text-[10px] bg-emerald-600 text-white px-3 py-2 font-bold rounded">AÑADIR OBRA</button>
                            )}
                            
                            <button onClick={() => setView('cart')} className="relative text-sm font-medium">
                                Bolsa ({cart.length})
                                {cart.length > 0 && <span className="absolute -top-2 -right-3 bg-white text-black text-[8px] w-4 h-4 rounded-full flex items-center justify-center font-bold">!</span>}
                            </button>
                        </div>
                    </nav>

                    <main className="pt-32 px-6 max-w-6xl mx-auto pb-20">
                        {view === 'shop' && (
                            <>
                                <header className="text-center mb-16">
                                    <h2 className="font-serif text-5xl md:text-7xl italic">Nuestra Herencia</h2>
                                    <p className="text-neutral-500 uppercase text-[10px] tracking-[0.5em] mt-4">Curaduría de piezas únicas</p>
                                </header>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                                    {products.map(p => (
                                        <div key={p.id} className="group relative">
                                            <div className="aspect-[3/4] bg-neutral-900 mb-6 overflow-hidden relative">
                                                <img src={p.image} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105" />
                                                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center p-6">
                                                    <button onClick={() => setCart([...cart, p])} className="bg-white text-black px-8 py-3 text-[10px] font-black uppercase tracking-widest">Seleccionar</button>
                                                </div>
                                                {isAdmin && (
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); deleteProduct(p.id); }}
                                                        className="absolute top-4 right-4 bg-red-600/80 hover:bg-red-600 text-white p-2 rounded-full transition-colors"
                                                        title="Eliminar producto de la base de datos"
                                                    >
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18m-2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                                                    </button>
                                                )}
                                            </div>
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h3 className="font-serif text-xl italic">{p.name}</h3>
                                                    <p className="text-[10px] text-neutral-500 uppercase mt-1">Oaxaca, MX</p>
                                                </div>
                                                <span className="text-lg font-light">${p.price}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}

                        {view === 'cart' && (
                            <div className="max-w-xl mx-auto py-10">
                                <h2 className="font-serif text-5xl italic mb-12 text-center">Tu Bolsa</h2>
                                {cart.length === 0 ? (
                                    <div className="text-center py-20 border border-white/5 bg-neutral-900/20">
                                        <p className="text-neutral-500 uppercase text-[10px] tracking-widest">No has seleccionado ninguna pieza aún</p>
                                        <button onClick={() => setView('shop')} className="mt-6 text-xs underline uppercase">Volver a la galería</button>
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        {cart.map((item, i) => (
                                            <div key={i} className="flex items-center gap-6 py-4 border-b border-white/5 group">
                                                <img src={item.image} className="w-16 h-20 object-cover" />
                                                <div className="flex-1">
                                                    <h3 className="font-serif text-xl italic">{item.name}</h3>
                                                    <p className="text-xs text-neutral-500">${item.price}</p>
                                                </div>
                                                <button onClick={() => removeFromCart(i)} className="text-neutral-600 hover:text-red-500 transition-colors">
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 18L18 6M6 6l12 12"/></svg>
                                                </button>
                                            </div>
                                        ))}
                                        <div className="mt-12 pt-6 border-t border-white flex justify-between items-end">
                                            <span className="text-neutral-500 text-[10px] uppercase font-bold tracking-widest">Inversión Total</span>
                                            <span className="text-4xl font-serif italic">${cart.reduce((s, i) => s + i.price, 0)}</span>
                                        </div>
                                        <button className="w-full mt-10 bg-white text-black py-5 font-black uppercase text-[11px] tracking-[0.3em] hover:invert transition-all">Pagar Ahora</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Modal para Administrador */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] bg-black/98 flex items-center justify-center p-6 backdrop-blur-sm">
                            <div className="bg-neutral-900 p-10 w-full max-w-md border border-white/10 relative shadow-2xl">
                                <button onClick={() => setIsModalOpen(false)} className="absolute top-6 right-6 text-neutral-500 hover:text-white uppercase text-[10px] font-bold">Cerrar</button>
                                <h3 className="font-serif text-3xl italic mb-8">Nueva Pieza</h3>
                                <form onSubmit={handleUpload} className="space-y-6">
                                    <div className="bg-black aspect-video flex items-center justify-center border border-dashed border-white/20 relative group overflow-hidden">
                                        {newProduct.image ? <img src={newProduct.image} className="w-full h-full object-cover" /> : <div className="text-center"><p className="text-[10px] uppercase text-neutral-500">Subir Fotografía</p></div>}
                                        <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" onChange={e => {
                                            const reader = new FileReader();
                                            reader.onload = () => setNewProduct({...newProduct, image: reader.result});
                                            reader.readAsDataURL(e.target.files[0]);
                                        }} />
                                    </div>
                                    <input required placeholder="Nombre de la obra" className="w-full bg-transparent border-b border-white/10 p-3 text-sm focus:border-white outline-none transition-colors" onChange={e => setNewProduct({...newProduct, name: e.target.value})} />
                                    <input required type="number" placeholder="Precio (MXN)" className="w-full bg-transparent border-b border-white/10 p-3 text-sm focus:border-white outline-none transition-colors" onChange={e => setNewProduct({...newProduct, price: e.target.value})} />
                                    <button className="w-full bg-white text-black py-4 text-[10px] font-black uppercase tracking-widest mt-4">Publicar en Galería</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
